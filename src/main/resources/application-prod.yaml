# 静态资源缓存
spring:
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 1d
  mail:
    host: ${MAIL_HOST}

# 禁用 swagger-ui try it out
springdoc:
  swagger-ui:
    supported-submit-methods:

# 数据源配置
mybatis-flex:
  datasource:
    master:
      driver-class-name: ${JDBC_DRIVER}
      url: ${JDBC_URL}
      username: ${JDBC_USERNAME}
      password: ${JDBC_PASSWORD}
      poolName: master

sa-token:
  # 是否输出操作日志
  is-log: false
  # 日志等级（trace、debug、info、warn、error、fatal）
  log-level: info

# 自定义配置
custom:
  jar-package:
    location: /tmp/upload-jar #jar包上传路径
