# 静态资源缓存
spring:
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 1d
  mail:
    host: ${MAIL_HOST}

# 禁用 swagger-ui try it out
springdoc:
  swagger-ui:
    supported-submit-methods:

# 数据源配置
mybatis-flex:
  datasource:
    master:
      driver-class-name: ${JDBC_DRIVER}
      url: ${JDBC_URL}
      username: ${JDBC_USERNAME}
      password: ${JDBC_PASSWORD}
      poolName: master

sa-token:
  # 是否输出操作日志
  is-log: false
  # 日志等级（trace、debug、info、warn、error、fatal）
  log-level: info


custom:
  ai:
    # 向量数据库（全局唯一共享实例，配置变更需重启生效；type: memory-内置内存（开发/测试） / milvus）
    vector-db:
      type: milvus
      milvus:
        host: ${MILVUS_HOST}
        port: ${MILVUS_PORT:19530}
        username: ${MILVUS_USERNAME:root}
        password: ${MILVUS_PASSWORD}
        database-name: ${MILVUS_DATABASE:default}
        collection-name: ${MILVUS_COLLECTION:knowledge_chunks} # 全局唯一共享集合名
        dimension: ${MILVUS_DIMENSION:1024} # 向量维度，须与 Embedding 模型输出维度一致（bge-small-zh-v1.5-q 为 512）
    # Embedding 模型（全局唯一共享实例，配置变更需重启生效；type: onnx-内置本地模型 / openai-OpenAI兼容接口）
    embedding:
      type: openai
      openai:
        base-url: ${EMBEDDING_BASE_URL}
        api-key: ${EMBEDDING_API_KEY}
        model-name: ${EMBEDDING_MODEL_NAME}