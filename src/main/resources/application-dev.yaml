# h2 控制台
spring:
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true

# 开启 swagger-ui try it out
springdoc:
  swagger-ui:
    supported-submit-methods: get, put, post, delete, options, head, patch, trace

# 数据源配置
mybatis-flex:
  datasource:
    master:
      driver-class-name: org.h2.Driver
      url: jdbc:h2:file:./database;MODE=MySQL;DB_CLOSE_DELAY=-1
      username: sa
      password: 123
      poolName: master

sa-token:
  # 是否输出操作日志
  is-log: true
  # 日志等级（trace、debug、info、warn、error、fatal）
  log-level: debug


custom:
  ai:
    # 向量数据库（全局唯一共享实例，配置变更需重启生效；type: memory-内置内存（开发/测试） / milvus）
    vector-db:
      type: memory
    # Embedding 模型（全局唯一共享实例，配置变更需重启生效；type: onnx-内置本地模型 / openai-OpenAI兼容接口）
    embedding:
      type: onnx
      onnx:
        model-path: D://env//bge-small-zh-v1.5-q.onnx # ONNX 模型文件路径
        tokenizer-path: D://env//bge-small-zh-v1.5-q-tokenizer.json
        pooling-mode: cls # 向量池化方式：CLS-取[CLS]位置向量 / MEAN-全序列均值（bge 系列用 CLS）